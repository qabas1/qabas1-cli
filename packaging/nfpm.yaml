# nFPM config template for the qabas CLI .deb package.
# Substituted by scripts/package-deb.sh: VERSION, ARCH, BIN_SRC, MAN_SRC
name: qabas
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: utils
priority: optional
maintainer: QabasOne <ops@qabas.one>
description: |
  Official system administration CLI for QabasOne.
  Installs only the qabas binary; product data lives under /etc/qabasone and /var/lib/qabasone.
vendor: QabasOne
homepage: https://github.com/qabas1/qabas1-cli
license: Proprietary
contents:
  - src: ${BIN_SRC}
    dst: /usr/bin/qabas
    file_info:
      mode: 0755
  - src: ${MAN_SRC}
    dst: /usr/share/man/man1/qabas.1.gz
    file_info:
      mode: 0644
